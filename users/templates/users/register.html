{% extends 'catalog/base.html' %}

{% block content %}
<h1 class="mb-4">Регистрация</h1>

<form method="post" class="w-50">
    {% csrf_token %}
    {{ form.non_field_errors }}

    {% for field in form %}
        <div class="mb-3">
            <label class="form-label">{{ field.label }}</label>
            {{ field }}
            {{ field.errors }}
        </div>
    {% endfor %}

    <button type="submit" class="btn btn-success mt-2">Создать аккаунт</button>
</form>

{% endblock %}
