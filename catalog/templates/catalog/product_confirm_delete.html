{% extends 'catalog/base.html' %}
{% block title %}Удалить товар — Novashop{% endblock %}
{% block content %}
<h2 class="h5 mb-3">Удалить «{{ object.name }}»?</h2>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a class="btn btn-link" href="{% url 'catalog:detail' object.pk %}">Отмена</a>
</form>
{% endblock %}
