services:
  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             poetry run gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    env_file:
      - ./.env
    depends_on:
      - db
      - redis
    expose:
      - "8000"
    volumes:
      - static_volume:/app/staticfiles

  nginx:
    build:
      context: ./nginx
    ports:
      - "8080:80"
    depends_on:
      - web
    volumes:
      - static_volume:/app/staticfiles
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  db:
    image: postgres:16
    env_file:
      - ./.env
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  redis:
    image: redis:7
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  static_volume:
  redis_data:
