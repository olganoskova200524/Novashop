{% extends 'catalog/base.html' %}
{% block title %}Удалить статью — Блог{% endblock %}
{% block content %}
<h2 class="h5 mb-3">Удалить статью «{{ object.title }}»?</h2>
<form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Удалить</button>
    <a class="btn btn-link" href="{{ object.get_absolute_url }}">Отмена</a>
</form>
{% endblock %}
